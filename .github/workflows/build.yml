name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-encryption-key: ${{ secrets.CACHE_ENCRYPTION_KEY }}

      - name: Build
        run: sh gradlew assemble

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coreless-alfheim
          path: build/libs
